<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <!-- PWA: 아이폰 홈 화면 "추가"로 앱처럼 쓴다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f4f4f6" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131315" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="HIRO" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <title>정하윤 · LIFE OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <!-- 잠금 화면이 그려지기 전 흰 화면이 번쩍이지 않도록 배경을 미리 깔아둔다 -->
    <style>
      html,
      body {
        background: #f4f4f6;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #131315;
        }
      }
    </style>
    <!-- 잠금 해제·복호화 유틸. 앱 번들보다 먼저 올라와야 한다 -->
    <script src="/hy-crypto.js?v=2"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => { navigator.serviceWorker.register('/sw.js').catch(() => {}) })
      }
    </script>
  </body>
</html>
