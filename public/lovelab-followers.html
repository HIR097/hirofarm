<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>팔로워 트래커 — 연애실험실</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#e7e7ea; --bg2:#f1f1f3; --surface:#ffffff; --surface2:#f3f3f5;
  --text:#101012; --text-2:#71717a; --text-3:#a6a6ad; --line:#e8e8ec;
  --shadow:0 1px 2px rgba(18,18,26,.04), 0 10px 30px rgba(18,18,26,.06);
  --accent:#101012; --accent-text:#ffffff;
  --good:#0ca678; --bad:#e03131;
  --c-lovelab:#0ca678; --c-noona:#4c6ef5;
}
:root[data-theme="dark"]{
  --bg:#08080a; --bg2:#0f0f12; --surface:#161619; --surface2:#1f1f23;
  --text:#f3f3f5; --text-2:#9a9aa2; --text-3:#62626a; --line:#26262b;
  --shadow:0 1px 2px rgba(0,0,0,.45), 0 10px 30px rgba(0,0,0,.55);
  --accent:#f4f4f6; --accent-text:#0a0a0b;
  --good:#38d9a9; --bad:#ff8787;
  --c-lovelab:#0ca678; --c-noona:#5c7cfa;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Space Grotesk',-apple-system,'Apple SD Gothic Neo','Pretendard','Malgun Gothic',Helvetica,Arial,sans-serif;
  background:var(--bg);color:var(--text);font-size:13.5px;line-height:1.55;transition:background .2s}
.wrap{max-width:1120px;margin:0 auto;padding:28px 26px 70px}
.mono{font-family:'JetBrains Mono',ui-monospace,monospace}

.hero{display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap;margin-bottom:6px}
.hero h1{font-size:26px;font-weight:700;letter-spacing:-.02em}
.hero h1 small{font-size:15px;font-weight:500;color:var(--text-2);margin-left:8px}
.chips{display:flex;flex-wrap:wrap;gap:7px;margin:12px 0 20px}
.chip{font-size:12px;color:var(--text-2);border:1px solid var(--line);background:var(--surface);
  padding:4px 11px;border-radius:9px;box-shadow:var(--shadow)}
.chip b{color:var(--text);font-weight:600;margin-left:5px;font-variant-numeric:tabular-nums}

.lbl{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.12em;color:var(--text-3);
  text-transform:uppercase;margin:26px 0 10px;display:flex;align-items:center;gap:8px}
.lbl::after{content:'';flex:1;height:1px;background:var(--line)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:15px;box-shadow:var(--shadow);padding:18px 20px}
.card h3{font-size:14.5px;font-weight:700;letter-spacing:-.01em;margin-bottom:3px;display:flex;align-items:center;gap:8px}
.card .sub{font-size:11.5px;color:var(--text-3);margin-bottom:12px}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
@media(max-width:860px){.duo{grid-template-columns:1fr}}
/* 모바일 */
@media(max-width:600px){
  .wrap{padding:18px 14px 56px}
  .hero h1{font-size:21px}
  .hero h1 small{display:block;margin-left:0;font-size:13px}
  .card{padding:14px 14px;border-radius:13px}
  .crow{grid-template-columns:104px 1fr 80px;gap:8px}
  .kpis{grid-template-columns:repeat(2,1fr);gap:8px}
  .lbl{margin:20px 0 8px}
}

.dot{display:inline-block;width:9px;height:9px;border-radius:3px;flex:none}

/* cast rows */
.crow{display:grid;grid-template-columns:150px 1fr 108px;gap:10px;align-items:center;
  padding:8px 9px;border-radius:11px;cursor:pointer;transition:background .12s}
.crow:hover{background:var(--surface2)}
.crow.sel{background:var(--surface2);outline:1.5px solid var(--text-3)}
.crow .who .nm{font-size:13px;font-weight:600;line-height:1.25}
.crow .who .nm .meb{font-size:9.5px;color:var(--good);border:1px solid var(--good);border-radius:5px;padding:0 4px;margin-left:5px;vertical-align:1px}
.crow .who .hd{font:500 10.5px 'JetBrains Mono',monospace;color:var(--text-3)}
.crow .barcell{position:relative;height:16px;border-radius:5px;overflow:hidden}
.crow .barcell i{position:absolute;left:0;top:2px;bottom:2px;border-radius:4px;min-width:2px}
.crow .num{text-align:right;font-variant-numeric:tabular-nums}
.crow .num .d{font-size:12.5px;font-weight:700}
.crow .num .p{font-size:10.5px;color:var(--text-3)}
.pos{color:var(--good)}.neg{color:var(--bad)}
.nodata{color:var(--text-3);font-size:11px}

/* detail */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:12px 0 4px}
.kpi{background:var(--surface2);border:1px solid var(--line);border-radius:13px;padding:12px 15px}
.kpi .k{font:600 9.5px 'JetBrains Mono',monospace;letter-spacing:.1em;color:var(--text-3);text-transform:uppercase}
.kpi .v{font-size:21px;font-weight:700;letter-spacing:-.02em;margin:3px 0 1px;font-variant-numeric:tabular-nums}
.kpi .v em{font-style:normal;font-size:12px;color:var(--text-2);font-weight:500}
.kpi .d{font-size:10.5px;color:var(--text-3)}
.dhead{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.dhead h3{font-size:17px}
.dhead a{font:500 11.5px 'JetBrains Mono',monospace;color:var(--text-2);text-decoration:none;border-bottom:1px dashed var(--text-3)}
.dhead a:hover{color:var(--text)}
.showtag{font-size:10.5px;padding:2px 8px;border-radius:6px;font-weight:600}
.note{font-size:11px;color:var(--text-3);margin-top:2px}
.charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
@media(max-width:860px){.charts{grid-template-columns:1fr}}
.chart h4{font-size:12px;font-weight:600;color:var(--text-2);margin-bottom:8px}
.chart svg{width:100%;height:auto;display:block}
.empty{font-size:11.5px;color:var(--text-3);border:1px dashed var(--line);border-radius:11px;
  padding:22px 14px;text-align:center;margin-top:6px}

/* table */
table{width:100%;border-collapse:collapse;font-size:12px}
th{font:600 10px 'JetBrains Mono',monospace;letter-spacing:.05em;color:var(--text-3);text-align:right;
  padding:7px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-transform:uppercase}
th:first-child,td:first-child{text-align:left}
td{padding:6.5px 8px;border-bottom:1px solid var(--line);text-align:right;color:var(--text);
  font:500 12.3px 'Space Grotesk',-apple-system,'Apple SD Gothic Neo',sans-serif;font-variant-numeric:tabular-nums}
tr:last-child td{border-bottom:0}
tr.me td{background:rgba(18,184,134,.08);font-weight:600}
.tblwrap{overflow-x:auto;margin-top:12px}

/* 북마클릿 임시 반영 표시 */
.chip.tmp{border-color:var(--bad)}
.chip.tmp b{color:var(--bad)}

#tip{position:fixed;z-index:60;pointer-events:none;background:var(--surface);border:1px solid var(--line);
  border-radius:9px;box-shadow:var(--shadow);padding:7px 11px;font-size:11.5px;display:none;max-width:240px}
#tip b{font-variant-numeric:tabular-nums}
footer{margin-top:38px;font-size:11px;color:var(--text-3);line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>팔로워 트래커<small>연애실험실 × 누난 내게 여자야 2</small></h1>
  </div>
  <div class="chips" id="chips"></div>

  <div class="lbl">프로그램별 출연자 — 방송 최초 대비 증감</div>
  <div class="duo" id="groups"></div>

  <div class="lbl">출연자 상세</div>
  <div class="card" id="detail"><div class="empty">위에서 출연자를 클릭하면 상세 추이가 표시됩니다</div></div>

  <div class="lbl">전체 표</div>
  <div class="card">
    <h3>출연자 전체</h3>
    <div class="sub">최초 = 방송 최초 시점 캡처 (≈ 표시는 인스타 축약표기라 근사값) · 오늘 = 최신 수집값</div>
    <div class="tblwrap"><table id="tbl"></table></div>
  </div>

  <footer>
    최초 팔로워: 방송 시작 시점 인스타그램 캡처 (통합 문서1.xlsx) · 일별 수집: 2026-08-01부터<br>
    페이지는 lovelab-data.js 를 읽어 자동 반영 · 새 스냅샷은 수집 스크립트(tools/lovelab_update.py)로 추가
  </footer>
</div>
<div id="tip"></div>

<!-- 데이터는 항상 최신을 읽어야 하므로 캐시 무효화 쿼리를 붙여 동기 로드한다.
     (일반 <script src="lovelab-data.js"> 는 브라우저가 캐시해서 새 스냅샷이 바로 안 보인다) -->
<script>document.write('<script src="lovelab-data.js?t=' + Date.now() + '"><\/script>')</script>
<script>
/* ---- hirofarm 테마 연동 (hy_theme / hy_accent) ---- */
const ACC = {mono:null,
  lime:['oklch(0.83 0.16 128)','#0a0a0b'], blue:['oklch(0.62 0.16 252)','#ffffff'],
  orange:['oklch(0.70 0.16 56)','#0a0a0b'], violet:['oklch(0.60 0.16 300)','#ffffff'],
  pink:['oklch(0.66 0.17 6)','#ffffff']};
function applyTheme(){
  try{
    const q = new URLSearchParams(location.search).get('theme');
    document.documentElement.dataset.theme = q || localStorage.getItem('hy_theme')||'light';
    const a = ACC[localStorage.getItem('hy_accent')||'mono'];
    const st = document.documentElement.style;
    if(a){ st.setProperty('--accent',a[0]); st.setProperty('--accent-text',a[1]); }
    else { st.removeProperty('--accent'); st.removeProperty('--accent-text'); }
  }catch(e){}
}
window.addEventListener('storage', applyTheme);
applyTheme();

const D = window.LOVELAB_DATA;

/* ---- 북마클릿 수집분(임시 스냅샷) 수신·병합 ----
   #snap=<base64 JSON> 로 들어온 값을 localStorage 에 쌓고 D.snapshots 에 얹는다.
   lovelab-data.js 에 정식 커밋되면(같은 날짜가 생기면) 임시본은 자동으로 버려진다. */
const PEND_KEY = 'lovelab_pending_snaps';
const readPend  = () => { try{ return JSON.parse(localStorage.getItem(PEND_KEY) || '{}'); }catch(e){ return {}; } };
const writePend = o  => { try{ localStorage.setItem(PEND_KEY, JSON.stringify(o)); }catch(e){} };
const b64decode = s => decodeURIComponent(escape(atob(s)));
const b64encode = s => btoa(unescape(encodeURIComponent(s)));

(function ingestHash(){
  const m = location.hash.match(/^#snap=(.+)$/);
  if(!m) return;
  try{
    const o = JSON.parse(b64decode(decodeURIComponent(m[1])));
    if(o && o.date && o.counts && Object.keys(o.counts).length){
      const p = readPend();
      p[o.date] = {...(p[o.date] || {}), ...o.counts};
      writePend(p);
    }
  }catch(e){ console.warn('수집 결과 파싱 실패', e); }
  history.replaceState(null, '', location.pathname + location.search);
})();
/* 이미 이 페이지가 떠 있는 탭에 #snap 이 붙으면 해시만 바뀌어 스크립트가 다시 안 돈다 → 새로고침 */
window.addEventListener('hashchange', () => { if(/^#snap=/.test(location.hash)) location.reload(); });

const pending = readPend();
Object.keys(pending).forEach(d => { if(D.snapshots[d]) delete pending[d]; });  // 커밋된 날짜는 임시본 폐기
writePend(pending);
const PEND_DATES = Object.keys(pending).sort();
PEND_DATES.forEach(d => { D.snapshots[d] = {...(D.snapshots[d] || {}), ...pending[d]}; });

const DATES = Object.keys(D.snapshots).sort();
const LAST = DATES[DATES.length-1];
const fmt = n => n==null ? '—' : n.toLocaleString('ko-KR');
const sgn = n => (n>0?'+':'') + n.toLocaleString('ko-KR');
const pct = (d,b) => b ? (d>=0?'+':'')+(d/b*100).toFixed(1)+'%' : '—';
const cvar = show => `var(--c-${show})`;
const tip = document.getElementById('tip');
function showTip(html, x, y){
  tip.innerHTML = html; tip.style.display='block';
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(x+14, innerWidth-r.width-10)+'px';
  tip.style.top  = Math.max(8, Math.min(y+14, innerHeight-r.height-10))+'px';
}
function hideTip(){ tip.style.display='none'; }

function seriesOf(h){ return DATES.map(d => ({date:d, v:D.snapshots[d][h] ?? null})).filter(p => p.v!=null); }
function todayOf(h){ const s = seriesOf(h); return s.length ? s[s.length-1].v : null; }

const rows = D.cast.map(c => {
  const today = todayOf(c.handle);
  const delta = (today!=null && c.initial!=null) ? today - c.initial : null;
  return {...c, today, delta};
});

/* ---- chips ---- */
document.getElementById('chips').innerHTML = [
  `<span class="chip">수집 시작<b>2026-08-01</b></span>`,
  `<span class="chip">최신 수집<b>${LAST}</b></span>`,
  `<span class="chip">스냅샷<b>${DATES.length}일치</b></span>`,
  `<span class="chip">출연자<b>${rows.length}명</b></span>`,
  PEND_DATES.length ? `<span class="chip tmp">임시 반영<b>${PEND_DATES.join(', ')}</b></span>` : '',
].join('');

/* ---- group lists ---- */
const groupsEl = document.getElementById('groups');
let selected = null;
function renderGroups(){
  groupsEl.innerHTML = Object.entries(D.shows).map(([key, sh]) => {
    const list = rows.filter(r => r.show===key)
      .sort((a,b) => (b.delta??-Infinity) - (a.delta??-Infinity));
    const maxD = Math.max(1, ...list.map(r => Math.abs(r.delta??0)));
    return `<div class="card">
      <h3><i class="dot" style="background:${cvar(key)}"></i>${sh.label}</h3>
      <div class="sub">${list.length}명 · 증감순 · 클릭하면 상세</div>
      ${list.map(r => {
        const w = r.delta!=null ? Math.abs(r.delta)/maxD*100 : 0;
        const num = r.delta==null
          ? `<span class="nodata">${r.today==null?'오늘값 수집 필요':'최초값 없음'}</span>`
          : `<div class="d ${r.delta>=0?'pos':'neg'}">${sgn(r.delta)}</div><div class="p">${pct(r.delta, r.initial)}</div>`;
        return `<div class="crow${selected===r.handle?' sel':''}" data-h="${r.handle}">
          <div class="who"><div class="nm">${r.name}${r.me?'<span class="meb">나</span>':''}</div>
            <div class="hd">@${r.handle}</div></div>
          <div class="barcell"><i style="width:${w}%;background:${r.delta!=null&&r.delta<0?'var(--bad)':cvar(key)};opacity:${r.delta!=null?.85:0}"></i></div>
          <div class="num">${num}</div>
        </div>`;
      }).join('')}
    </div>`;
  }).join('');
  groupsEl.querySelectorAll('.crow').forEach(el => {
    el.onclick = () => { select(el.dataset.h, true); };
    el.onmousemove = e => {
      const r = rows.find(x => x.handle===el.dataset.h);
      showTip(`<b>${r.name}</b> @${r.handle}<br>최초 ${r.approx?'≈':''}${fmt(r.initial)} → 오늘 ${fmt(r.today)}`, e.clientX, e.clientY);
    };
    el.onmouseleave = hideTip;
  });
}

/* ---- detail ---- */
function select(h, scroll){
  selected = h; renderGroups(); hideTip();
  const r = rows.find(x => x.handle===h);
  const sh = D.shows[r.show];
  const s = seriesOf(h);
  const days = s.length>=2 ? (new Date(s[s.length-1].date) - new Date(s[0].date))/86400000 : 0;
  const avg = days>0 ? Math.round((s[s.length-1].v - s[0].v)/days) : null;
  document.getElementById('detail').innerHTML = `
    <div class="dhead">
      <h3>${r.name}${r.me?'<span class="meb" style="font-size:10px;color:var(--good);border:1px solid var(--good);border-radius:5px;padding:0 5px;margin-left:6px;vertical-align:2px">나</span>':''}</h3>
      <a href="https://instagram.com/${h}" target="_blank" rel="noreferrer">@${h} ↗</a>
      <span class="showtag" style="color:${cvar(r.show)};background:color-mix(in srgb, ${cvar(r.show)} 13%, transparent)">${sh.label}</span>
    </div>
    ${r.note ? `<div class="note">참고: ${r.note}</div>` : ''}
    <div class="kpis">
      <div class="kpi"><div class="k">방송 최초</div><div class="v">${r.approx?'≈':''}${fmt(r.initial)}</div><div class="d">캡처 기준${r.approx?' · 근사값':''}</div></div>
      <div class="kpi"><div class="k">오늘 (${LAST.slice(5)})</div><div class="v">${fmt(r.today)}</div><div class="d">최신 스냅샷</div></div>
      <div class="kpi"><div class="k">증감</div><div class="v ${r.delta==null?'':(r.delta>=0?'pos':'neg')}">${r.delta==null?'—':sgn(r.delta)}</div><div class="d">${pct(r.delta, r.initial)} (최초 대비)</div></div>
      <div class="kpi"><div class="k">일평균 증가</div><div class="v">${avg==null?'—':sgn(avg)}<em>/일</em></div><div class="d">${avg==null?'스냅샷 2일 이상 필요':'수집 기간 평균'}</div></div>
    </div>
    <div class="charts">
      <div class="chart"><h4>팔로워 추이 (2026-08-01~)</h4><div id="chLine"></div></div>
      <div class="chart"><h4>일별 증가 인원</h4><div id="chBar"></div></div>
    </div>`;
  drawLine(r, s); drawBars(r, s);
  if(scroll) document.getElementById('detail').scrollIntoView({behavior:'smooth', block:'nearest'});
}

const W=480, H=230, PL=58, PR=14, PT=14, PB=30;
function xpos(i, n){ return n<=1 ? PL+(W-PL-PR)/2 : PL + (W-PL-PR)*i/(n-1); }

function drawLine(r, s){
  const el = document.getElementById('chLine');
  if(!s.length){ el.innerHTML = `<div class="empty">아직 수집된 스냅샷이 없습니다</div>`; return; }
  const vals = s.map(p=>p.v).concat(r.initial!=null?[r.initial]:[]);
  let lo = Math.min(...vals), hi = Math.max(...vals);
  const pad = Math.max((hi-lo)*.12, hi*.01, 10); lo=Math.max(0,lo-pad); hi+=pad;
  const y = v => PT + (H-PT-PB)*(1-(v-lo)/(hi-lo));
  const n = s.length;
  const ticks = [lo, (lo+hi)/2, hi].map(v=>Math.round(v));
  let g = ticks.map(v=>`<line x1="${PL}" x2="${W-PR}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>
    <text x="${PL-8}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="var(--text-3)" font-family="JetBrains Mono">${fmt(v)}</text>`).join('');
  if(r.initial!=null){
    g += `<line x1="${PL}" x2="${W-PR}" y1="${y(r.initial)}" y2="${y(r.initial)}" stroke="var(--text-3)" stroke-width="1" stroke-dasharray="4 4"/>
      <text x="${W-PR}" y="${y(r.initial)-5}" text-anchor="end" font-size="9.5" fill="var(--text-2)">방송 최초 ${r.approx?'≈':''}${fmt(r.initial)}</text>`;
  }
  const pts = s.map((p,i)=>`${xpos(i,n)},${y(p.v)}`).join(' ');
  if(n>1) g += `<polyline points="${pts}" fill="none" stroke="${cvar(r.show)}" stroke-width="2" stroke-linejoin="round"/>`;
  s.forEach((p,i)=>{
    g += `<circle cx="${xpos(i,n)}" cy="${y(p.v)}" r="4" fill="${cvar(r.show)}" stroke="var(--surface)" stroke-width="2"/>`;
    if(i===n-1) g += `<text x="${xpos(i,n)}" y="${y(p.v)-9}" text-anchor="middle" font-size="10" font-weight="600" fill="var(--text)">${fmt(p.v)}</text>`;
  });
  const lastTicks = n<=6 ? s.map((_,i)=>i) : [0, Math.floor((n-1)/2), n-1];
  lastTicks.forEach(i=>{ g += `<text x="${xpos(i,n)}" y="${H-9}" text-anchor="middle" font-size="9.5" fill="var(--text-3)" font-family="JetBrains Mono">${s[i].date.slice(5)}</text>`; });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${r.name} 팔로워 추이">${g}
    <rect x="${PL}" y="${PT}" width="${W-PL-PR}" height="${H-PT-PB}" fill="transparent" id="lineHit"/></svg>`;
  el.querySelector('#lineHit').onmousemove = e => {
    const b = el.querySelector('svg').getBoundingClientRect();
    const mx = (e.clientX-b.left)/b.width*W;
    let bi=0, bd=1e9; s.forEach((p,i)=>{ const d=Math.abs(xpos(i,n)-mx); if(d<bd){bd=d;bi=i;} });
    const p = s[bi], prev = bi>0 ? p.v - s[bi-1].v : (r.initial!=null ? p.v-r.initial : null);
    showTip(`<b>${p.date}</b><br>팔로워 <b>${fmt(p.v)}</b>${prev!=null?`<br>${bi>0?'전일':'최초'} 대비 <b>${sgn(prev)}</b>`:''}`, e.clientX, e.clientY);
  };
  el.querySelector('#lineHit').onmouseleave = hideTip;
}

function drawBars(r, s){
  const el = document.getElementById('chBar');
  if(s.length<2){
    el.innerHTML = `<div class="empty">일별 증가는 스냅샷이 2일 이상 쌓이면 표시됩니다<br>(내일 수집분부터)</div>`;
    return;
  }
  const bars = s.slice(1).map((p,i)=>({date:p.date, d:p.v - s[i].v}));
  const mx = Math.max(...bars.map(b=>Math.abs(b.d)), 1);
  const hasNeg = bars.some(b=>b.d<0);
  const base = hasNeg ? PT+(H-PT-PB)/2 : H-PB;
  const scale = (hasNeg ? (H-PT-PB)/2 : H-PT-PB) / mx * .9;
  const bw = Math.min(34, (W-PL-PR)/bars.length - 4);
  let g = `<line x1="${PL}" x2="${W-PR}" y1="${base}" y2="${base}" stroke="var(--line)" stroke-width="1"/>`;
  bars.forEach((b,i)=>{
    const cx = PL + (W-PL-PR)*(i+.5)/bars.length;
    const h = Math.max(2, Math.abs(b.d)*scale);
    const yy = b.d>=0 ? base-h : base;
    g += `<rect x="${cx-bw/2}" y="${yy}" width="${bw}" height="${h}" rx="4"
      fill="${b.d>=0?cvar(r.show):'var(--bad)'}" data-i="${i}"/>`;
    if(bars.length<=10) g += `<text x="${cx}" y="${b.d>=0?yy-5:yy+h+11}" text-anchor="middle" font-size="9.5" font-weight="600" fill="var(--text-2)">${sgn(b.d)}</text>`;
    if(bars.length<=8) g += `<text x="${cx}" y="${H-9}" text-anchor="middle" font-size="9.5" fill="var(--text-3)" font-family="JetBrains Mono">${b.date.slice(5)}</text>`;
  });
  el.innerHTML = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${r.name} 일별 팔로워 증가">${g}</svg>`;
  el.querySelectorAll('rect[data-i]').forEach(rc => {
    rc.onmousemove = e => { const b = bars[+rc.dataset.i];
      showTip(`<b>${b.date}</b><br>전일 대비 <b>${sgn(b.d)}</b>명`, e.clientX, e.clientY); };
    rc.onmouseleave = hideTip;
  });
}

/* ---- table ---- */
document.getElementById('tbl').innerHTML =
  `<tr><th>이름</th><th>계정</th><th>프로그램</th><th>방송 최초</th><th>오늘</th><th>증감</th><th>증감률</th></tr>` +
  rows.map(r => `<tr${r.me?' class="me"':''}>
    <td>${r.name}</td>
    <td style="text-align:left"><span class="mono" style="font-size:11px">@${r.handle}</span></td>
    <td style="text-align:left"><span class="dot" style="background:${cvar(r.show)};margin-right:6px"></span>${D.shows[r.show].short}</td>
    <td>${r.initial==null?'—':(r.approx?'≈':'')+fmt(r.initial)}</td>
    <td>${fmt(r.today)}</td>
    <td class="${r.delta==null?'':(r.delta>=0?'pos':'neg')}">${r.delta==null?'—':sgn(r.delta)}</td>
    <td>${pct(r.delta, r.initial)}</td>
  </tr>`).join('');

renderGroups();
/* 기본 선택: 본인 계정 (데이터 있으면), 없으면 증가폭 1위 */
const def = rows.find(r=>r.me && r.today!=null)
  || [...rows].sort((a,b)=>(b.delta??-Infinity)-(a.delta??-Infinity))[0];
if(def) select(def.handle);

</script>
